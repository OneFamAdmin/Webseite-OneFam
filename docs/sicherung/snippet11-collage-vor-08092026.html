<!-- CSS, stand vor .colnote -->
<style>
  .colgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .ctile{position:relative;aspect-ratio:4/4.6;border-radius:4px;overflow:hidden;background:#cdbfa8 center/cover no-repeat;display:flex;align-items:flex-end;padding:22px;transition:.3s}
  .ctile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,0) 55%,rgba(20,16,12,.5))}
  .ctile span{position:relative;z-index:2;color:#fff;font-family:'Cabinet Grotesk',sans-serif;font-size:22px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .ctile:hover{transform:scale(1.008)}
  @media(max-width:1100px){.colgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){.colgrid{grid-template-columns:repeat(2,1fr)}}
</style>

    </div>
